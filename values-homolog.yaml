# Override values for homolog environment
namespace: bns

image:
  tag: homolog

ingress:
  hosts:
    - host: api.homolog.bnscred.com.br
      serviceName: axxis-app-bff
    - host: api-preview.homolog.bnscred.com.br
      serviceName: axxis-app-bff-preview

hpa:
  minReplicas: 1
  maxReplicas: 3

configmap:
  data:
    BFF_PORT: "8080"
    BACKEND_ADIANTAMENTO_URL: "http://axxis-app-ads/api/v1"
    BACKEND_BNS_URL: "http://axxis-bns-api/api/v1"
    BNS_API_BASE_URL: "http://axxis-bns-api/api/v1"
    BNS_OAUTH_CLIENT_ID: "adiantamento-salario"
