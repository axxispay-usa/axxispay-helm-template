# -- Global settings
nameOverride: ""
fullnameOverride: ""

# -- Kill switch: quando false, nenhum recurso é criado no cluster
enabled: true

# -- Namespace onde os recursos serão criados
namespace: ""

# -- Image settings
image:
  repository: ""   # obrigatório: ex: 000000000000.dkr.ecr.us-east-1.amazonaws.com/my-app
  tag: latest
  pullPolicy: Always

# -- Replica settings (gerenciado pelo HPA quando habilitado)
replicaCount: 1

# -- ServiceAccount com suporte a IRSA (IAM Roles for Service Accounts)
serviceAccount:
  enabled: false
  annotations: {}

# -- Pod-level security context (runAsUser, runAsGroup, fsGroup)
podSecurityContext: {}

# -- Preview deployment separado (Rollout + ConfigMap com labels distintos)
preview:
  enabled: false
  configmap:
    data: {}

# -- Argo Rollout strategy
rollout:
  enabled: true
  strategy:
    canary:
      maxSurge: "25%"
      maxUnavailable: 0
      # steps são opcionais — sem steps o Argo promove 100% imediatamente
      # steps:
      #   - setWeight: 25
      #   - pause: {}

# -- Container resources
resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    memory: 128Mi

# -- Container port
containerPort: 8080

# -- Health probe settings
probes:
  liveness:
    enabled: false
    path: /health
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: false
    path: /health
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# -- Security context
securityContext:
  allowPrivilegeEscalation: false
  runAsUser: 1001

# -- Reloader (Stakater) — reinicia pods ao detectar mudanças em ConfigMap/Secret
reloader:
  enabled: true
  strategy: restart

# -- Service settings
service:
  port: 80
  targetPort: 8080
  preview:
    enabled: false

# -- Ingress settings (AWS ALB)
ingress:
  enabled: true
  ingressClassName: alb
  annotations:
    alb.ingress.kubernetes.io/group.name: ""
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: ""
    alb.ingress.kubernetes.io/listen-ports: "[{\"HTTP\":80},{\"HTTPS\":443}]"
    alb.ingress.kubernetes.io/certificate-arn: ""   # obrigatório: arn:aws:acm:<region>:<account>:certificate/<id>
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/success-codes: "200-399"
  hosts: []
  # hosts:
  #   - host: app.example.com
  #   - host: app-preview.example.com
  #     serviceName: my-app-preview   # informar apenas quando apontar para outra release

# -- HPA settings
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 90
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15

# -- ConfigMap env vars (variáveis não sensíveis)
configmap:
  enabled: true
  data: {}
  # data:
  #   APP_PORT: "8080"
  #   BACKEND_URL: "http://my-service/api/v1"

# -- ExternalSecret — AWS Secrets Manager via ESO (>= v0.10)
externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ""   # obrigatório: nome do ClusterSecretStore configurado no cluster
  target:
    creationPolicy: Owner
  dataFrom: []
  # dataFrom:
  #   - extract:
  #       key: my-namespace/my-app-secrets
