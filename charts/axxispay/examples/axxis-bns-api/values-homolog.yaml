# Deploy: helm upgrade --install axxis-bns-api axxispay/helm-template -f values-homolog.yaml
# Todos os recursos serão criados com o nome: axxis-bns-api
namespace: bns

image:
  repository: 000000000000.dkr.ecr.us-east-1.amazonaws.com/axxis-bns-api
  tag: homolog

ingress:
  hosts:
    - host: api.homolog.example.com

hpa:
  minReplicas: 1
  maxReplicas: 3

externalSecret:
  refreshInterval: 5m
  dataFrom:
    - extract:
        key: namespace/app-name

configmap:
  data:
    APP_PORT: "8080"
    DATABASE_URL: "jdbc:postgresql://db-host:5432/db-name"
