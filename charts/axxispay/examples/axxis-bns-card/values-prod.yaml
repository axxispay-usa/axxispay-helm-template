# Deploy: helm upgrade --install axxis-bns-card axxispay/helm-template -f values-prod.yaml --set image.tag=<GIT_SHA>
# Todos os recursos serão criados com o nome: axxis-bns-card
namespace: bns

image:
  repository: 000000000000.dkr.ecr.us-east-1.amazonaws.com/axxis-bns-card
  tag: latest

ingress:
  hosts:
    - host: card.example.com

hpa:
  minReplicas: 2
  maxReplicas: 8

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

externalSecret:
  refreshInterval: 1h
  dataFrom:
    - extract:
        key: namespace/app-name

configmap:
  data:
    APP_PORT: "8080"
    BACKEND_BNS_URL: "http://backend-service/api/v1"
