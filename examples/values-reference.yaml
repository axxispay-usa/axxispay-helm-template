# =============================================================================
# values-reference.yaml — Referência completa de todas as configurações
# Copie apenas os campos que deseja sobrescrever no seu values-<env>.yaml
# =============================================================================

# -- Sobrescreve o nome do chart (padrão: nome do Chart.yaml)
nameOverride: ""

# -- Sobrescreve o nome completo gerado para os recursos
fullnameOverride: "my-app"

# -- Namespace onde os recursos serão criados
namespace: my-namespace

# ------------------------------------------------------------------------------
# Image
# ------------------------------------------------------------------------------
image:
  repository: 636155393863.dkr.ecr.us-east-1.amazonaws.com/my-app
  tag: "abc123"        # sempre substituir pela tag real no CI/CD (git SHA)
  pullPolicy: Always   # Always | IfNotPresent | Never

# -- Número de réplicas iniciais (gerenciado pelo HPA em produção)
replicaCount: 1

# ------------------------------------------------------------------------------
# Argo Rollout
# ------------------------------------------------------------------------------
rollout:
  enabled: true
  strategy:
    canary:
      maxSurge: "25%"
      maxUnavailable: 0
      # steps são opcionais — sem steps o Argo promove 100% imediatamente
      steps:
        - setWeight: 25
        - pause: {}       # pausa manual (aprovar via Argo CD / kubectl)
        - setWeight: 50
        - pause:
            duration: 60s # pausa automática de 60s antes de continuar
        - setWeight: 100

# ------------------------------------------------------------------------------
# Resources
# ------------------------------------------------------------------------------
resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    memory: 128Mi   # sem limit de CPU é recomendado para evitar throttling

# -- Porta exposta pelo container
containerPort: 8080

# ------------------------------------------------------------------------------
# Health Probes
# ------------------------------------------------------------------------------
probes:
  liveness:
    path: /health
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# ------------------------------------------------------------------------------
# Security Context
# ------------------------------------------------------------------------------
securityContext:
  allowPrivilegeEscalation: false
  runAsUser: 1001
  # readOnlyRootFilesystem: true  # ativar se a app não precisar escrever em disco

# ------------------------------------------------------------------------------
# Reloader (Stakater) — reinicia pods ao detectar mudanças em ConfigMap/Secret
# Requer Stakater Reloader instalado no cluster com suporte a Argo Rollouts
# ------------------------------------------------------------------------------
reloader:
  enabled: true
  strategy: restart

# ------------------------------------------------------------------------------
# Service
# ------------------------------------------------------------------------------
service:
  port: 80
  targetPort: 8080

# ------------------------------------------------------------------------------
# Ingress (AWS ALB)
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  ingressClassName: alb
  annotations:
    alb.ingress.kubernetes.io/group.name: axxis-app
    alb.ingress.kubernetes.io/scheme: internet-facing       # internet-facing | internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: my-app
    alb.ingress.kubernetes.io/listen-ports: "[{\"HTTP\":80},{\"HTTPS\":443}]"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:000000000000:certificate/xxxx
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/success-codes: "200-399"
    # Redirecionar HTTP → HTTPS (recomendado em produção)
    # alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type":"redirect","RedirectConfig":{"Protocol":"HTTPS","Port":"443","StatusCode":"HTTP_301"}}'
  hosts:
    # sem serviceName: o ingress aponta automaticamente para o Service da própria release
    - host: api.example.com
    # serviceName é opcional — informar apenas quando apontar para outra release (ex: preview)
    - host: api-preview.example.com
      serviceName: my-app-preview

# ------------------------------------------------------------------------------
# HPA (Horizontal Pod Autoscaler) — autoscaling/v2
# Alvo: Argo Rollout (não Deployment)
# ------------------------------------------------------------------------------
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  metrics:
    # Escala por memória
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 90
    # Escala por CPU (descomentar se necessário)
    # - type: Resource
    #   resource:
    #     name: cpu
    #     target:
    #       type: Utilization
    #       averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15

# ------------------------------------------------------------------------------
# ConfigMap — variáveis de configuração não sensíveis
# ------------------------------------------------------------------------------
configmap:
  enabled: true
  data:
    APP_PORT: "8080"
    LOG_LEVEL: "info"
    BACKEND_URL: "http://my-backend-service/api/v1"

# ------------------------------------------------------------------------------
# ExternalSecret — busca segredos do AWS Secrets Manager via ESO
# Requer External Secrets Operator >= v0.10 (apiVersion: external-secrets.io/v1)
# Para ESO < v0.10 use: external-secrets.io/v1beta1 (ajustar em external-secret.yaml)
# ------------------------------------------------------------------------------
externalSecret:
  enabled: true
  refreshInterval: 1h    # homolog: 5m | prod: 1h (evitar throttling no Secrets Manager)
  secretStoreRef:
    kind: ClusterSecretStore
    name: bns-apps
  target:
    creationPolicy: Owner
  dataFrom:
    # Extrai todas as chaves do segredo como variáveis de ambiente
    - extract:
        key: my-app/my-app-secrets
    # Múltiplas fontes (descomentar se necessário)
    # - extract:
    #     key: shared/database-credentials
