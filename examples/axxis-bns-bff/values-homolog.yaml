# Deploy: helm upgrade --install axxis-bns-bff axxispay/helm-template -f values-homolog.yaml
# Todos os recursos serão criados com o nome: axxis-bns-bff
namespace: bns

image:
  repository: 636155393863.dkr.ecr.us-east-1.amazonaws.com/axxis-bns-bff
  tag: homolog

ingress:
  hosts:
    - host: bff.homolog.bnscred.com.br
    - host: bff-preview.homolog.bnscred.com.br
      serviceName: axxis-bns-bff-preview

hpa:
  minReplicas: 1
  maxReplicas: 3

externalSecret:
  refreshInterval: 5m
  dataFrom:
    - extract:
        key: bns/axxis-bns-bff

configmap:
  data:
    BFF_PORT: "8080"
    BACKEND_ADIANTAMENTO_URL: "http://axxis-bns-ads/api/v1"
    BACKEND_BNS_URL: "http://axxis-bns-api/api/v1"
    BNS_API_BASE_URL: "http://axxis-bns-api/api/v1"
    BNS_OAUTH_CLIENT_ID: "adiantamento-salario"
