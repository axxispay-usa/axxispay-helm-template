apiVersion: v1
kind: Service
metadata:
  name: {{ include "axxis-app-bff.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "axxis-app-bff.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "axxis-app-bff.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
