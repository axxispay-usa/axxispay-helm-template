apiVersion: v1
kind: Service
metadata:
  name: {{ include "axxispay-helm-template.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "axxispay-helm-template.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "axxispay-helm-template.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
